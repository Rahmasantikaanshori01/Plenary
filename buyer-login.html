<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plenary — Buyer Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet"
    >
    

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            font-family: "DM Sans", Arial, sans-serif;
            background: #1d1920;
            color: white;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .login-page {

            --primary: #e98eaf;
            --secondary: #f7c8c0;

            position: relative;

            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            padding: 70px 30px;

            background: #241d25;
        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .background {

            position: absolute;

            inset: 0;

            background-image:
                url("./assets/pink.jpg");

            background-size: cover;

            background-position: center;

            transform: scale(1.05);

            transition: transform 1s ease;

            z-index: 0;
        }


        .background::before {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(42, 20, 38, .86),
                    rgba(71, 36, 62, .48),
                    rgba(28, 18, 28, .80)
                );
        }


        .background::after {

            content: "";

            position: absolute;

            width: 600px;
            height: 600px;

            left: -180px;
            top: -180px;

            border-radius: 50%;

            background: #e88bab;

            filter: blur(120px);

            opacity: .22;
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {

            position: absolute;

            top: 35px;
            left: 50px;

            z-index: 10;

            display: flex;

            align-items: center;

            gap: 11px;

            color: white;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 2px;
        }


        .logo {

            position: relative;

            width: 18px;
            height: 18px;

            transform: rotate(45deg);
        }


        .logo-one,
        .logo-two {

            position: absolute;

            width: 11px;
            height: 11px;

            border-radius: 2px;
        }


        .logo-one {

            top: 0;
            left: 0;

            background: #f6b5c8;
        }


        .logo-two {

            right: 0;
            bottom: 0;

            background: #d8a6d4;
        }


        /* =====================================================
           SIGN UP
        ===================================================== */

        .signup {

            position: absolute;

            top: 37px;
            right: 50px;

            z-index: 10;

            font-size: 11px;

            color: rgba(255,255,255,.72);
        }


        .signup a {

            color: white;

            font-weight: 700;

            text-decoration: none;

            transition: .3s ease;
        }


        .signup a:hover {

            color: #f7c8c0;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .card {

            position: relative;

            z-index: 5;

            width: 930px;

            max-width: 92vw;

            min-height: 550px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            align-items: center;

            padding: 43px;

            border-radius: 22px;

            border: 1px solid rgba(255,255,255,.42);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.23),
                    rgba(255,255,255,.075)
                );

            backdrop-filter: blur(25px);

            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 35px 100px rgba(0,0,0,.45),
                inset 0 1px 0 rgba(255,255,255,.25);

            overflow: hidden;

            animation: cardIn .8s ease;
        }


        .card::before {

            content: "";

            position: absolute;

            width: 450px;
            height: 450px;

            right: -230px;
            bottom: -240px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.20),
                    transparent 68%
                );
        }


        .card::after {

            content: "";

            position: absolute;

            width: 250px;
            height: 250px;

            left: -160px;
            top: -160px;

            border-radius: 50%;

            background: #ed8fae;

            filter: blur(80px);

            opacity: .18;
        }


        @keyframes cardIn {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(.96);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =====================================================
           LEFT
        ===================================================== */

        .intro {

            position: relative;

            z-index: 3;

            align-self: start;

            padding: 15px;
        }


        .intro h1 {

            font-size: 40px;

            line-height: 1;

            letter-spacing: -2px;

            font-weight: 600;
        }


        .intro h1 span {

            display: block;

            margin-top: 5px;

            font-family: "Playfair Display", serif;

            font-size: 50px;

            font-style: italic;

            font-weight: 400;

            letter-spacing: -1px;

            color: #f7c8c0;
        }


        .intro p {

            max-width: 320px;

            margin-top: 16px;

            color: rgba(255,255,255,.80);

            font-size: 12px;

            line-height: 1.7;
        }


        /* =====================================================
           SLOGAN
        ===================================================== */

        .slogan {

            position: absolute;

            top: 105px;

            right: 10px;

            font-family: "Playfair Display", serif;

            font-size: 27px;

            font-style: italic;

            line-height: .92;

            color: #f7c8c0;

            transform: rotate(-7deg);

            animation: floating 4s ease-in-out infinite;
        }


        .slogan::after {

            content: "✦";

            position: absolute;

            right: -20px;
            top: -14px;

            color: white;

            font-family: Arial;

            font-size: 13px;
        }


        @keyframes floating {

            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(-7deg);
            }

            50% {
                transform:
                    translateY(-8px)
                    rotate(-4deg);
            }
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-area {

            position: relative;

            z-index: 5;

            width: 100%;

            max-width: 390px;

            justify-self: end;

            padding: 0 10px;
        }


        .field {

            width: 100%;

            height: 48px;

            display: flex;

            align-items: center;

            gap: 11px;

            padding: 0 14px;

            margin-bottom: 11px;

            border: 1px solid rgba(255,255,255,.48);

            border-radius: 13px;

            background: rgba(255,255,255,.07);

            transition: .3s ease;
        }


        .field:hover {

            background: rgba(255,255,255,.12);

            transform: translateY(-1px);
        }


        .field:focus-within {

            border-color: white;

            background: rgba(255,255,255,.14);

            box-shadow:
                0 0 0 3px rgba(255,255,255,.05);
        }


        .field svg {

            width: 16px;
            height: 16px;

            flex-shrink: 0;

            color: rgba(255,255,255,.82);
        }


        .field input {

            width: 100%;

            border: none;

            outline: none;

            background: transparent;

            color: white;

            font-family: inherit;

            font-size: 11px;
        }


        .field input::placeholder {

            color: rgba(255,255,255,.62);
        }


        /* =====================================================
           OPTIONS
        ===================================================== */

        .options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin: 12px 1px 15px;

            font-size: 9px;

            color: rgba(255,255,255,.78);
        }


        .remember {

            display: flex;

            align-items: center;

            gap: 6px;

            cursor: pointer;
        }


        .remember input {

            appearance: none;

            width: 12px;
            height: 12px;

            border-radius: 3px;

            border: 1px solid rgba(255,255,255,.7);

            background: rgba(255,255,255,.08);
        }


        .remember input:checked {

            background: #ed8fae;

            border-color: #ed8fae;
        }


        .remember input:checked::after {

            content: "✓";

            display: block;

            text-align: center;

            color: white;

            font-size: 9px;

            line-height: 11px;
        }


        .forgot {

            color: rgba(255,255,255,.84);

            text-decoration: none;
        }


        /* =====================================================
           BUTTON
        ===================================================== */

        .login-button {

            width: 100%;

            height: 47px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    105deg,
                    #ed8eae,
                    #f5bdb8
                );

            color: white;

            font-family: inherit;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 14px 30px rgba(0,0,0,.20);

            transition: .3s ease;
        }


        .login-button:hover {

            transform: translateY(-3px);

            filter: brightness(1.08);

            box-shadow:
                0 19px 40px rgba(0,0,0,.30);
        }


        .login-button span {

            display: inline-block;

            transition: .3s ease;
        }


        .login-button:hover span {

            transform: translateX(6px);
        }


        /* =====================================================
           OR
        ===================================================== */

        .or {

            display: flex;

            align-items: center;

            gap: 10px;

            margin: 17px 0;

            color: rgba(255,255,255,.64);

            font-size: 9px;
        }


        .or::before,
        .or::after {

            content: "";

            flex: 1;

            height: 1px;

            background: rgba(255,255,255,.18);
        }


        /* =====================================================
           SOCIAL
        ===================================================== */

        .social {

            display: flex;

            justify-content: center;

            gap: 10px;
        }


        .social button {

            width: 48px;

            height: 37px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,.20);

            background: rgba(255,255,255,.08);

            color: white;

            cursor: pointer;

            font-size: 14px;

            transition: .3s ease;
        }


        .social button:hover {

            transform: translateY(-4px);

            background: rgba(255,255,255,.17);

            border-color: rgba(255,255,255,.45);
        }


        /* =====================================================
           NOTE
        ===================================================== */

        .note {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 17px;

            padding-top: 15px;

            border-top: 1px solid rgba(255,255,255,.14);

            color: rgba(255,255,255,.68);

            font-size: 9px;

            line-height: 1.45;
        }


        .note-icon {

            width: 33px;
            height: 33px;

            flex-shrink: 0;

            display: grid;

            place-items: center;

            border-radius: 50%;

            background: rgba(255,255,255,.12);

            color: #f7c8c0;
        }


        .note strong {

            display: block;

            color: white;

            margin-bottom: 2px;
        }


        /* =====================================================
           ROLE NAV
        ===================================================== */

        .roles {

            position: fixed;

            z-index: 20;

            bottom: 18px;

            left: 50%;

            transform: translateX(-50%);

            display: flex;

            gap: 4px;

            padding: 5px;

            border: 1px solid rgba(255,255,255,.18);

            border-radius: 14px;

            background: rgba(20,16,22,.60);

            backdrop-filter: blur(15px);
        }


        .roles a {

            padding: 8px 13px;

            border-radius: 9px;

            color: rgba(255,255,255,.68);

            text-decoration: none;

            font-size: 9px;

            transition: .3s ease;
        }


        .roles a:hover,
        .roles a.active {

            color: white;

            background: rgba(255,255,255,.17);
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 850px) {

            .card {

                width: 560px;

                grid-template-columns: 1fr;

                min-height: auto;

                padding: 35px 30px;
            }


            .intro {

                margin-bottom: 25px;

                padding: 0;
            }


            .slogan {

                display: none;
            }


            .form-area {

                max-width: none;

                padding: 0;
            }
        }


        @media (max-width: 560px) {

            .login-page {

                padding: 85px 15px 75px;
            }


            .brand {

                left: 22px;

                top: 25px;
            }


            .signup {

                right: 22px;

                top: 27px;
            }


            .card {

                padding: 28px 20px;
            }


            .intro h1 {

                font-size: 32px;
            }


            .intro h1 span {

                font-size: 41px;
            }
        }

    </style>

</head>


<body>


    <div class="login-page">


        <!-- BACKGROUND -->

        <div class="background"></div>


        <!-- BRAND -->

        <a href="index.html" class="brand">

            <div class="logo">

                <span class="logo-one"></span>

                <span class="logo-two"></span>

            </div>

            PLENARY

        </a>


        <!-- SIGN UP -->

        <div class="signup">

            Don't have an account?

            <a href="#">
                Sign up
            </a>

        </div>


        <!-- CARD -->

        <div class="card">


            <!-- LEFT -->

            <div class="intro">

                <h1>

                    Welcome Back,

                    <span>
                        Buyer
                    </span>

                </h1>


                <p>

                    Log in to discover amazing events,
                    concerts, and more.

                </p>


                <div class="slogan">

                    Good
                    <br>

                    Vibes
                    <br>

                    Only

                </div>

            </div>


            <!-- FORM -->

            <div class="form-area">

                <form id="buyerForm">


                    <!-- EMAIL -->

                    <div class="field">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                        >

                            <path
                                d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
                            />

                            <circle
                                cx="12"
                                cy="7"
                                r="4"
                            />

                        </svg>


                        <input
                            type="text"
                            placeholder="Email or Phone Number"
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="field">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                        >

                            <rect
                                x="4"
                                y="10"
                                width="16"
                                height="11"
                                rx="2"
                            />

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            />

                        </svg>


                        <input
                            type="password"
                            placeholder="Password"
                        >

                    </div>


                    <!-- OPTIONS -->

                    <div class="options">

                        <label class="remember">

                            <input type="checkbox">

                            Remember me

                        </label>


                        <a
                            href="#"
                            class="forgot"
                        >
                            Forgot password?
                        </a>

                    </div>


                    <!-- LOGIN -->

                    <button
                        type="submit"
                        class="login-button"
                    >

                        <span>
                            Login&nbsp; →
                        </span>

                    </button>


                    <!-- OR -->

                    <div class="or">

                        or continue with

                    </div>


                    <!-- SOCIAL -->

                    <div class="social">

                        <button type="button">
                            G
                        </button>

                        <button type="button">
                            
                        </button>

                        <button type="button">
                            ✉
                        </button>

                    </div>


                    <!-- NOTE -->

                    <div class="note">

                        <div class="note-icon">
                            ♡
                        </div>


                        <div>

                            <strong>
                                New here?
                            </strong>

                            Explore events, buy tickets,
                            and create unforgettable memories.

                        </div>

                    </div>


                </form>

            </div>

        </div>


        <!-- ROLE -->

        <div class="roles">

            <a
                href="buyer-login.html"
                class="active"
            >
                Buyer
            </a>

            <a href="seller-login.html">
                Seller
            </a>

            <a href="admin-login.html">
                Admin
            </a>

        </div>


    </div>


    <script>

        /* =====================================================
           PARALLAX BACKGROUND
        ===================================================== */

        const page =
            document.querySelector(".login-page");

        const background =
            document.querySelector(".background");


        page.addEventListener(
            "mousemove",
            function(event) {

                const x =
                    (event.clientX / window.innerWidth - .5) * 10;

                const y =
                    (event.clientY / window.innerHeight - .5) * 7;


                background.style.transform =
                    `scale(1.08) translate(${x}px, ${y}px)`;

            }
        );


        page.addEventListener(
            "mouseleave",
            function() {

                background.style.transform =
                    "scale(1.05) translate(0,0)";

            }
        );


        /* =====================================================
           LOGIN
        ===================================================== */

        document
            .getElementById("buyerForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();

                    const button =
                        document.querySelector(".login-button");

                    const original =
                        button.innerHTML;

                    button.innerHTML =
                        "<span>Logging in...</span>";

                    button.disabled = true;


                    setTimeout(
                        function() {

                            button.innerHTML =
                                original;

                            button.disabled = false;

                        },
                        1000
                    );

                }
            );

    </script>


</body>

</html>
